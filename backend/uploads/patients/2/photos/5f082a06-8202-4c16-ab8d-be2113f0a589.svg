<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1020" width="100%" height="100%" style="background:#FAFCFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>

    <!-- Soft Drop Shadow -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Connectors -->
  <!-- Top Main Spine -->
  <path d="M 460 70 L 460 100" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 156 L 460 186" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 242 L 460 272" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 328 L 460 360" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Decision 1 Branches -->
  <path d="M 460 450 L 460 490" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-emerald)"/>
  <path d="M 535 405 L 685 405" stroke="#E11D48" stroke-width="2" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- Mid Flow -->
  <path d="M 460 546 L 460 580" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 636 L 460 670" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Decision 2 Branches -->
  <!-- Approve (Left) -->
  <path d="M 385 715 L 240 715 L 240 790" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-emerald)"/>
  <!-- Reject (Right) -->
  <path d="M 535 715 L 680 715 L 680 790" stroke="#E11D48" stroke-width="2" fill="none" marker-end="url(#arrow-rose)"/>
  <!-- Request Changes Loop (Back to Creator) -->
  <path d="M 385 700 L 140 700 L 140 518 L 338 518" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- Final Terminals -->
  <path d="M 240 846 L 240 890" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-emerald)"/>
  <path d="M 680 846 L 680 890" stroke="#E11D48" stroke-width="2" fill="none" marker-end="url(#arrow-rose)"/>

  <!-- Nodes -->
  <!-- 1. Brand creates campaign -->
  <g transform="translate(340, 14)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </g>
    <text x="54" y="25" font-size="13" font-weight="600" fill="#0F172A">Brand creates campaign</text>
    <text x="54" y="42" font-size="11" fill="#64748B">(brief + budget)</text>
  </g>

  <!-- 2. Funds locked in escrow -->
  <g transform="translate(340, 100)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </g>
    <text x="54" y="33" font-size="13" font-weight="600" fill="#0F172A">Funds locked in escrow</text>
  </g>

  <!-- 3. Campaign goes live -->
  <g transform="translate(340, 186)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-3.05 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </g>
    <text x="54" y="33" font-size="13" font-weight="600" fill="#0F172A">Campaign goes live</text>
  </g>

  <!-- 4. Creator applies -->
  <g transform="translate(340, 272)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </g>
    <text x="54" y="33" font-size="13" font-weight="600" fill="#0F172A">Creator applies</text>
  </g>

  <!-- Decision 1: Brand reviews application -->
  <g transform="translate(385, 360)">
    <polygon points="75,0 150,45 75,90 0,45" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <g transform="translate(63, 18)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </g>
    <text x="75" y="56" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Brand reviews</text>
    <text x="75" y="70" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">application</text>
  </g>

  <!-- Decision Labels (D1) -->
  <rect x="466" y="458" width="50" height="20" rx="4" fill="#ECFDF5"/>
  <text x="491" y="472" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Accept</text>

  <rect x="565" y="393" width="48" height="20" rx="4" fill="#FFF1F2"/>
  <text x="589" y="407" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">Reject</text>

  <!-- Branch 1 Right: Creator applies elsewhere -->
  <g transform="translate(685, 377)" filter="url(#card-shadow)">
    <rect width="200" height="56" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
    <g transform="translate(14, 16)" stroke="#E11D48" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 14 4 9 9 4"/>
      <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
    </g>
    <text x="46" y="26" font-size="12" font-weight="600" fill="#9F1239">Creator applies</text>
    <text x="46" y="42" font-size="11" fill="#BE123C">elsewhere</text>
  </g>

  <!-- 5. Creator produces content -->
  <g transform="translate(340, 490)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r=".5" fill="#0284C7"/>
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
    <text x="54" y="25" font-size="13" font-weight="600" fill="#0F172A">Creator produces</text>
    <text x="54" y="42" font-size="11" fill="#64748B">content</text>
  </g>

  <!-- 6. Proof submitted -->
  <g transform="translate(340, 580)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(18, 16)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </g>
    <text x="54" y="33" font-size="13" font-weight="600" fill="#0F172A">Proof submitted</text>
  </g>

  <!-- Decision 2: Brand reviews proof -->
  <g transform="translate(385, 670)">
    <polygon points="75,0 150,45 75,90 0,45" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <g transform="translate(63, 18)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </g>
    <text x="75" y="56" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Brand reviews</text>
    <text x="75" y="70" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">proof</text>
  </g>

  <!-- Decision Labels (D2) -->
  <rect x="260" y="703" width="56" height="20" rx="4" fill="#ECFDF5"/>
  <text x="288" y="717" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">Approve</text>

  <rect x="580" y="703" width="48" height="20" rx="4" fill="#FFF1F2"/>
  <text x="604" y="717" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">Reject</text>

  <!-- Request changes badge on loop -->
  <rect x="148" y="605" width="180" height="22" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="238" y="620" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">Request changes (max 2)</text>

  <!-- Outcome 1: Escrow payout -->
  <g transform="translate(130, 790)" filter="url(#card-shadow)">
    <rect width="220" height="56" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <g transform="translate(16, 16)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </g>
    <text x="48" y="26" font-size="12" font-weight="600" fill="#065F46">Escrow releases payout</text>
    <text x="48" y="42" font-size="11" fill="#047857">Sent to creator wallet</text>
  </g>

  <!-- Outcome 2: Full Refund -->
  <g transform="translate(570, 790)" filter="url(#card-shadow)">
    <rect width="220" height="56" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
    <g transform="translate(16, 16)" stroke="#E11D48" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
      <line x1="1" y1="10" x2="23" y2="10"/>
    </g>
    <text x="48" y="26" font-size="12" font-weight="600" fill="#9F1239">Full refund to brand</text>
    <text x="48" y="42" font-size="11" fill="#BE123C">Returned in full</text>
  </g>

  <!-- Terminals -->
  <!-- Campaign completed -->
  <g transform="translate(145, 890)">
    <rect width="190" height="42" rx="21" fill="#0F172A"/>
    <g transform="translate(18, 12)" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </g>
    <text x="108" y="26" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Campaign completed</text>
  </g>

  <!-- Campaign closed -->
  <g transform="translate(595, 890)">
    <rect width="170" height="42" rx="21" fill="#475569"/>
    <g transform="translate(18, 13)" stroke="#F87171" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="14" height="14" rx="2"/>
    </g>
    <text x="96" y="26" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Campaign closed</text>
  </g>
</svg>
